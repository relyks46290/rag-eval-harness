name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      # No model server in CI, so this covers chunking, scoring, question-set
      # validation, and run comparison. Retrieval quality is measured by
      # running the harness against a real Ollama instance, not here.
      - run: python tests/test_pipeline.py
